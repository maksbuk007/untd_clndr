<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание Мероприятий</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Анимированный фон -->
    <div class="bg-animation"></div>

    <div class="app-container glass">
        <header class="header">
            <div class="nav-month">
                <button id="prev-month" class="icon-btn">&#10094;</button>
                <h1 id="month-year">Загрузка...</h1>
                <button id="next-month" class="icon-btn">&#10095;</button>
            </div>
            <button id="theme-toggle" class="icon-btn">🌙</button>
        </header>

        <div class="calendar-wrapper">
            <div class="weekdays">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                <!-- Дни будут генерироваться через JS -->
            </div>
        </div>
    </div>

    <!-- Модальное окно для деталей дня -->
    <div id="modal" class="modal hidden">
        <div class="modal-content glass">
            <button id="close-modal" class="close-btn">&times;</button>
            <h2 id="modal-date">Дата</h2>
            <div id="modal-events-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
